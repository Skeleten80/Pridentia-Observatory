[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prudentia-observatory"
version = "0.1.0"
description = "Prudentia Observatory — Intelligent Telescope Tracking & Astrophotography Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prudentia Observatory Contributors" }]
keywords = ["astronomy", "telescope", "astrophotography", "observatory"]
dependencies = [
    "PySide6>=6.6.0",
    "astropy>=6.0.0",
    "skyfield>=1.48",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "Pillow>=10.2.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.6.0",
    "SQLAlchemy>=2.0.0",
    "watchdog>=4.0.0",
    "pytz>=2024.1",
]

[project.scripts]
prudentia = "prudentia_observatory.app.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pytest-cov>=5.0", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prudentia_observatory*"]

[tool.setuptools.package-data]
"prudentia_observatory.app.data" = ["*.sqlite", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["prudentia_observatory/tests"]
python_files = ["test_*.py"]
